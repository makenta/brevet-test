<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チェックポイント・ラリー</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; max-width: 600px; margin: 0 auto; }
        select { padding: 10px; font-size: 16px; width: 100%; margin: 20px 0; }
        button { padding: 15px; background: #007bff; color: white; border: none; border-radius: 5px; width: 100%; font-size: 18px; cursor: pointer; }
        button:disabled { background: #ccc; }
        #loading { display: none; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>参加者選択</h1>
    <div id="loading">データ読み込み中...</div>
    
    <div id="form-area" style="display:none;">
        <select id="memberSelect">
            <option value="">名前を選択してください</option>
        </select>
        <button onclick="startRally()">開始する</button>
    </div>

    <script>
        // ★ここにGASのURLを貼り付けてください
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyrScaCVZMYlZP1ig6a-5NBCa1pJcYh-LYYojjbioYtHw5P4MmAkieOFi3LqP9X2h8t/exec";

        document.addEventListener('DOMContentLoaded', async () => {
            const loading = document.getElementById('loading');
            const formArea = document.getElementById('form-area');
            const select = document.getElementById('memberSelect');

            loading.style.display = 'block';

            try {
                // GASはPOSTでJSON Bodyを受け取る仕様にしたためPOSTで取得
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getMembers' })
                });
                const data = await response.json();

                data.members.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = name;
                    select.appendChild(option);
                });

                // URLパラメータ ?user=山田 があれば自動選択
                const params = new URLSearchParams(window.location.search);
                const userParam = params.get('user');
                if (userParam) {
                    select.value = userParam;
                }

                formArea.style.display = 'block';
            } catch (error) {
                alert('通信エラー: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        });

        function startRally() {
            const name = document.getElementById('memberSelect').value;
            if (!name) return alert('名前を選択してください');
            // 名前をエンコードして遷移
            window.location.href = `gps.html?user=${encodeURIComponent(name)}`;
        }
    </script>
</body>
</html>
